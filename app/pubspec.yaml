name: lymarks
description: "Lymarks — turn forgotten links into accessible active memory."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  app_links: 6.4.0
  clerk_auth: 0.0.18-beta
  clerk_flutter: 0.0.18-beta
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  http: ^1.6.0
  intl: ^0.20.2
  logging: ^1.3.0
  lucide_icons_flutter: ^3.1.17
  path_provider: ^2.1.6
  purchases_flutter: 10.13.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

  assets:
    # La mascotte, detouree et retintee. Seule image embarquee : tout le
    # decor de l'onboarding est dessine avec les composants du design system.
    - assets/brand/mascot.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700

# Icone de lanceur : generee depuis `branding/` par
# `dart run flutter_launcher_icons` (a relancer apres tout changement de
# `branding/icon*.png`). Le resultat est commite dans android/app/src/main/res
# pour que la CI n'ait rien a generer.
#
# `icon.png`            : 1024, plein cadre, fond degrade bleu nuit du theme —
#                          sert aussi d'icone 1024 pour les stores et Devpost.
# `icon_foreground.png` : 1024, transparent, mascotte en plein cadre — le
#                          generateur applique lui-meme la marge de 16 % qui
#                          la ramene dans la zone sure du masque adaptatif.
# `mascot.png`          : la mascotte seule, detouree — source de retouche.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: branding/icon.png
  adaptive_icon_background: "#0D1F3C"
  adaptive_icon_foreground: branding/icon_foreground.png
  remove_alpha_ios: true
