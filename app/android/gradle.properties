# Machine de dev : 3,8 Go de RAM mesures (Risk Register R11).
# Le template Flutter autorise -Xmx8G : le daemon a ete tue faute de memoire.
#
# Reglages pour tenir sous ~1,5 Go pendant un build debug sans code natif :
#   - heap Gradle 1 Go, metaspace 512 Mo ;
#   - Kotlin compile dans le processus Gradle (pas de second daemon a 1 Go) ;
#   - pas de daemon resident : la memoire est rendue des la fin du build,
#     au prix d'un demarrage plus lent a chaque build ;
#   - un seul worker, pas de parallelisme.
# Fermer VS Code et le navigateur avant de builder.
org.gradle.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
