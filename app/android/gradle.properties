# Memoire plafonnee a dessein (Risk Register R11 : machine contrainte).
# Le template Flutter autorise -Xmx8G et 4G de metaspace : intenable ici.
# 2 Go suffisent a un build debug d'une app sans code natif.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
