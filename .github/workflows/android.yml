# Build Android en CI.
#
# La machine de developpement a 3,8 Go de RAM (Risk Register R11) : un build
# Gradle y est marginal. Ce workflow produit l'APK sur un runner GitHub
# (7 Go de RAM, gratuit pour un depot public, 2 000 min/mois en prive) et le
# met a disposition en artefact, telechargeable sur le telephone.
#
# Il joue aussi les gates de qualite (coding standards S4) : analyse stricte
# puis tests, y compris les rendus de reference.

name: android

on:
  push:
    branches: [master, main]
    paths: ["app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

# Le reglage du depot vaut deja `read`, mais un workflow ne doit pas en
# dependre : ce qu'il lui faut est ecrit ici.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Action tierce : epinglee au commit, pas a l'etiquette. Une etiquette se
      # deplace, et c'est alors son mainteneur qui choisit ce qui tourne ici.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Epinglee sur la version de la machine de dev (07-dev/02-journal).
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Dependances
        run: flutter pub get

      - name: Analyse stricte
        run: flutter analyze --fatal-infos

      # Les goldens sont propres a la plateforme qui les a generes (Windows) :
      # ils restent un outil local. La CI joue les tests de comportement.
      - name: Tests de comportement
        run: flutter test --exclude-tags golden

      # La publishable key Clerk (publique par design) et l'URL de l'API sont
      # injectees au build (AppConfig). Sans cle, l'app tournerait en mode
      # demo : on refuse de produire un APK ambigu.
      - name: Configuration de build
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::CLERK_PUBLISHABLE_KEY absent des GitHub Secrets : l'APK serait en mode demo."
            exit 1
          fi
          echo "Clerk : ${CLERK_PUBLISHABLE_KEY:0:8}… (${#CLERK_PUBLISHABLE_KEY} caracteres)"

      # Release decoupe par architecture : ~20 Mo par APK au lieu de 144 Mo
      # en debug (toutes les ABI + VM JIT). Signe avec la cle debug par le
      # template, donc installable en sideload. arm64 couvre les telephones
      # de moins de 8 ans ; armv7 reste pour les tests sur Android 10 ancien.
      # La cle RevenueCat est la cle publique du SDK (Test Store pendant le
      # Shipaton, cle Play ensuite) ; distincte de REVENUECAT_API_KEY, la cle
      # secrete REST que seule l'API detient. Sans elle l'APK n'a pas d'achats : le
      # paywall le dit, on avertit sans bloquer.
      #
      # Cle de Test Store (`test_…`) : le SDK Android ne l'accepte que dans une
      # app « debuggable » (ApplicationInfo.FLAG_DEBUGGABLE) et ferme l'app
      # sinon (« Wrong API Key », constate le 19/09). Le mode `profile` de
      # Flutter est exactement cela : herite du build type debug (donc
      # debuggable) mais compile AOT, sans bandeau — voir FlutterPlugin.kt
      # (`create("profile") { initWith(debug) }`, `buildModeFor`). Rendre la
      # release debuggable ne marcherait pas : Flutter la traiterait en debug
      # (JIT). Une cle Play ramene automatiquement la release.
      - name: APK par architecture (profile avec le Test Store, release sinon)
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          REVENUECAT_PUBLIC_KEY: ${{ secrets.REVENUECAT_PUBLIC_KEY }}
        run: |
          if [ -z "$REVENUECAT_PUBLIC_KEY" ]; then
            echo "::warning::REVENUECAT_PUBLIC_KEY absent des GitHub Secrets : APK sans achats."
          fi
          mode=release
          case "$REVENUECAT_PUBLIC_KEY" in
            test_*) mode=profile; echo "::notice::Cle Test Store : build profile (debuggable, AOT)." ;;
          esac
          flutter build apk --$mode --split-per-abi \
            --dart-define=CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" \
            --dart-define=REVENUECAT_PUBLIC_KEY="$REVENUECAT_PUBLIC_KEY" \
            --dart-define=LYMARKS_API_URL=https://lymarks-api.lymarks.workers.dev

      - name: Taille installee (budget 40 Mo, 08-qualite/02-performance-budget)
        run: ls -la build/app/outputs/flutter-apk/*.apk

      - name: Publier les APK
        uses: actions/upload-artifact@v4
        with:
          name: lymarks-release-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-*.apk
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-*.apk
          retention-days: 7

      # En cas d'echec d'un golden, les images de comparaison aident a juger.
      - name: Publier les ecarts de rendu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ github.sha }}
          path: app/test/failures/
          if-no-files-found: ignore
