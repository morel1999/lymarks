# Build Android en CI.
#
# La machine de developpement a 3,8 Go de RAM (Risk Register R11) : un build
# Gradle y est marginal. Ce workflow produit l'APK sur un runner GitHub
# (7 Go de RAM, gratuit pour un depot public, 2 000 min/mois en prive) et le
# met a disposition en artefact, telechargeable sur le telephone.
#
# Il joue aussi les gates de qualite (coding standards S4) : analyse stricte
# puis tests, y compris les rendus de reference.

name: android

on:
  push:
    branches: [master, main]
    paths: ["app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Epinglee sur la version de la machine de dev (07-dev/02-journal).
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Dependances
        run: flutter pub get

      - name: Analyse stricte
        run: flutter analyze --fatal-infos

      - name: Tests et rendus de reference
        run: flutter test

      - name: APK debug
        run: flutter build apk --debug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: lymarks-debug-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # En cas d'echec d'un golden, les images de comparaison aident a juger.
      - name: Publier les ecarts de rendu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ github.sha }}
          path: app/test/failures/
          if-no-files-found: ignore
