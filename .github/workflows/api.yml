# API : gates de qualite puis deploiement Cloudflare Workers.
#
# `check` joue sur chaque push/PR touchant api/ : typecheck, lint, format,
# tests (Coding Standards §4, Test Strategy § Gates). `deploy` ne tourne que
# sur master, et seulement si les secrets GitHub sont renseignes
# (api/scripts/push-secrets.ps1 les pousse depuis api/.dev.vars). Le
# deploiement ne part jamais d'une machine de dev (Security §7).

name: api

on:
  push:
    branches: [master, main]
    paths: ["api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
      REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Sans jeton Cloudflare ni base, on s'arrete proprement : le workflow
      # reste vert tant que l'infra n'est pas encore creee.
      - name: Secrets presents ?
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$DATABASE_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploiement saute : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID ou DATABASE_URL absent des GitHub Secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - if: steps.gate.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Migrations Neon
        if: steps.gate.outputs.ready == 'true'
        run: npm run migrate

      - name: Deploiement Workers
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler deploy | tee /tmp/deploy.log

      # Les secrets du Worker sont poses apres le premier deploiement (le
      # script doit exister). Seules les valeurs non vides sont envoyees.
      - name: Secrets Workers
        if: steps.gate.outputs.ready == 'true'
        run: |
          jq -n '[env | to_entries[]
                   | select(.key | IN("DATABASE_URL","CLERK_PUBLISHABLE_KEY","CLERK_SECRET_KEY","GROQ_API_KEY","GEMINI_API_KEY","REVENUECAT_WEBHOOK_SECRET","REVENUECAT_API_KEY"))
                   | select(.value != "")]
                 | from_entries' > /tmp/secrets.json
          npx wrangler secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json

      - name: Sante
        if: steps.gate.outputs.ready == 'true'
        run: |
          URL="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1 || true)"
          if [ -z "$URL" ]; then echo "::warning::URL workers.dev introuvable dans la sortie de deploy."; exit 0; fi
          echo "Worker : $URL"
          sleep 5
          curl -fsS "$URL/health" || echo "::warning::/health non joignable — verifier les secrets et la base."
