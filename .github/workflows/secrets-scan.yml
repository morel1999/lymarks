# Scan de secrets sur tout l'historique a chaque push (Test Strategy § Gates,
# Coding Standards §4). Une cle commise par erreur est une cle a revoquer
# (Risk Register R9) : autant le savoir dans la minute.

name: secrets-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
