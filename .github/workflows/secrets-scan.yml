# Scan de secrets sur tout l'historique a chaque push (Test Strategy § Gates,
# Coding Standards §4). Une cle commise par erreur est une cle a revoquer
# (Risk Register R9) : autant le savoir dans la minute.

name: secrets-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Epinglee au commit : cette action voit le GITHUB_TOKEN du job.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
